sources:
  - name: 人民日报
    url: https://paper.people.com.cn/rmrb/pc/layout/{date:%Y%m}/{date:%d}/node_01.html
    domain: paper.people.com.cn
    article: '/rmrb/(?:pc/)?content/.*content_[0-9]+\.html?'
    edition: '/rmrb/(?:pc/)?layout/.*node_[0-9]+\.html?'
    body: '#ozoom p, #articleContent p, #article p'
  - name: 经济日报
    url: https://www.ce.cn/cysc/tech/gd2012/
    extra_urls: [https://www.ce.cn/xwzx/gnsz/gdxw/]
    domain: ce.cn
    article: '/(?:xwzx/gnsz/gdxw|cysc/newmain/yc/jsxw|newmain/yc/jsxw)/[0-9]+/t[0-9]+_[0-9]+\.shtml'
    origin: 经济日报
    body: '.trs_editor_view p, .content p'
  - name: 光明日报
    url: https://epaper.gmw.cn/gmrb/html/layout/{date:%Y%m}/{date:%d}/node_01.html
    domain: epaper.gmw.cn
    article: '/gmrb/html/content/.*content_[0-9]+\.html'
    edition: '/gmrb/html/layout/.*node_[0-9]+\.html'
    body: '#ozoom p, #articleContent p, #article p, .m-article-main p'
  - name: 求是
    url: https://www.qstheory.cn/
    domain: qstheory.cn
    article: '/20[0-9]{6}/[a-f0-9]+/c\.html'
    origin: '求是'
    body: '#detailContent p'
    attribution: '.appellation'
    type: 观点评论
  - name: 国家发展改革委
    url: https://www.ndrc.gov.cn/xxgk/jd/jd/
    domain: ndrc.gov.cn
    article: '/xxgk/jd/jd/.*t[0-9]+_[0-9]+\.html'
    body: '.TRS_Editor p, .Custom_UnionStyle p, .article_content p, .article-con p'
    type: 政策解读
  - name: 国家数据局
    url: https://www.nda.gov.cn/sjj/zwgk/zjjd/list/index_pc_1.html
    extra_urls: [https://www.nda.gov.cn/sjj/zwgk/zcjd/list/index_pc_1.html]
    domain: nda.gov.cn
    show_attribution: true
    article: '/sjj/zwgk/(?:zcjd|zjjd)/.*_(?:pc|mobile)\.html'
    body: '.article > div, .article-content p, .TRS_Editor p, #zoom p'
    type: 政策解读
  - name: 工业和信息化部
    url: https://www.miit.gov.cn/zwgk/zcjd/index.html
    domain: miit.gov.cn
    article: '/zwgk/zcjd/.*art_.*\.html'
    body: '#con_con p, .TRS_Editor p, .article-content p'
    type: 政策解读

